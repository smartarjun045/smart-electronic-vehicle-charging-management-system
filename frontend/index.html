<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Smart Electronic Vehicle Charging Management System</title>
    <meta name="description" content="Smart Electronic Vehicle Charging Management System for finding nearby EV charging stations, booking slots, and tracking charging sessions across India." />
    <meta name="theme-color" content="#0fa870" />
    <!-- Installed/standalone-app behavior on iOS and Android, so Smart Electronic Vehicle Charging Management System
         feels native when added to the home screen (no browser chrome,
         themed status bar) rather than just opening another browser tab. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Smart EV Charging" />
    <link rel="canonical" href="https://your-deployed-domain.example/" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- PWA web manifest is auto-generated and injected by vite-plugin-pwa
         (see vite.config.ts) from the `manifest` option — no manual <link>
         needed here, avoiding a duplicate/conflicting manifest tag. -->

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Smart Electronic Vehicle Charging Management System" />
    <meta property="og:title" content="Smart Electronic Vehicle Charging Management System" />
    <meta property="og:description" content="Find nearby EV charging stations, book a slot, and track charging live with the Smart Electronic Vehicle Charging Management System." />
    <meta property="og:image" content="https://your-deployed-domain.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://your-deployed-domain.example/" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Electronic Vehicle Charging Management System" />
    <meta name="twitter:description" content="Find nearby EV charging stations, book a slot, and track charging live." />
    <meta name="twitter:image" content="https://your-deployed-domain.example/og-image.png" />

    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
