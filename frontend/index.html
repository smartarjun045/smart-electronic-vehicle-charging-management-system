<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>EVSync — Smart EV Charging Station Locator &amp; Slot Booking (India)</title>
    <meta name="description" content="Find nearby EV charging stations anywhere in India, book a slot in seconds, and track your charging session live. Academic open-source EV charging platform." />
    <meta name="theme-color" content="#0fa870" />
    <!-- Installed/standalone-app behavior on iOS and Android, so EVSync
         feels native when added to the home screen (no browser chrome,
         themed status bar) rather than just opening another browser tab. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EVSync" />
    <link rel="canonical" href="https://your-deployed-domain.example/" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- PWA web manifest is auto-generated and injected by vite-plugin-pwa
         (see vite.config.ts) from the `manifest` option — no manual <link>
         needed here, avoiding a duplicate/conflicting manifest tag. -->

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EVSync" />
    <meta property="og:title" content="EVSync — Smart EV Charging, Anywhere in India" />
    <meta property="og:description" content="Find nearby EV charging stations, book a slot, and track charging live — an open-source academic EV platform." />
    <meta property="og:image" content="https://your-deployed-domain.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://your-deployed-domain.example/" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EVSync — Smart EV Charging, Anywhere in India" />
    <meta name="twitter:description" content="Find nearby EV charging stations, book a slot, and track charging live." />
    <meta name="twitter:image" content="https://your-deployed-domain.example/og-image.png" />

    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
