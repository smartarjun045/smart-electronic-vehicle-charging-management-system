version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: smart-electronic-vehicle-charging-management-system-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - smart-electronic-vehicle-charging-management-system-mongo-data:/data/db

  backend:
    build: ./backend
    container_name: smart-electronic-vehicle-charging-management-system-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:8080
      MONGO_URI: mongodb://mongo:27017/smart-electronic-vehicle-charging-management-system
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_this_access_secret_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_in_production}
    ports:
      - '5000:5000'

  frontend:
    build: ./frontend
    container_name: smart-electronic-vehicle-charging-management-system-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  smart-electronic-vehicle-charging-management-system-mongo-data:
